{% extends base_template %}
{% load i18n %}
{% block content %}
<section class="mfa-card">
  <h1>{% trans "Enter your code" %}</h1>
  <p class="mfa-lede">{% trans "Open your authenticator app and enter the six-digit code it shows." %}</p>

  <form accept-charset="UTF-8" method="post" action="">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <dl class="form-group">
      <dt><label for="id_code">{% trans "Six-digit code" %}</label></dt>
      <dd>
        <input class="form-control mfa-code-input" id="id_code" type="text" name="code" value=""
               inputmode="numeric" pattern="[0-9]*" maxlength="6"
               autocomplete="one-time-code" spellcheck="false" autofocus
               aria-describedby="id_code_error">
        <p class="help-block text-danger" id="id_code_error">{% if error_message %}{{ error_message }}{% endif %}</p>
      </dd>
    </dl>
    <div class="mfa-actions">
      <button type="submit" class="btn btn-primary">{% trans "Verify" %}</button>
      <a href="{% url 'mfa:verify' %}" class="btn btn-default">{% trans "Use another method" %}</a>
    </div>
  </form>
</section>
{% endblock %}
